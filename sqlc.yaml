version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/core/repository/postgres/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/core/repository/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
